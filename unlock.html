<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width"><title>QVault · Unlock</title><link rel="stylesheet" href="hosted-test.css"><link rel="stylesheet" href="setup.css"></head><body><main class="unlock-window" id="unlock-main"><header><span class="brand"><img class="brand-icon" src="assets/icons/icon-128.png" width="34" height="34" alt="Q"><span class="brand-word">Vault</span><span class="state-badge exp-badge" title="Unaudited preview. Try it with test data.">EXPERIMENTAL</span></span></header><section class="card"><span class="eyebrow">UNLOCK</span><h2 id="unlock-heading">Unlock your vault</h2><p id="unlock-intro">Confirm with your passkey, for example Touch ID.</p><div class="form-actions" id="passkey-actions"><button id="passkey-go" class="primary" type="button"><span id="passkey-go-label">Unlock with passkey</span> <span aria-hidden="true">→</span></button><button id="unlock-cancel" type="button">Cancel</button></div><p id="unlock-status" role="status" aria-live="polite"></p><div id="reveal-box" class="recovery-panel" hidden><strong id="reveal-title"></strong><p id="reveal-user"></p><code id="reveal-password" class="recovery-key"></code><small id="reveal-previous" hidden></small><div class="form-actions"><button id="reveal-copy" type="button">Copy password</button><button id="reveal-close" type="button">Close</button></div></div><details class="recovery-unlock" id="recovery-details"><summary>Use your recovery key instead</summary><form id="recovery-form"><label>Recovery key<input id="recovery-key" type="password" autocomplete="off" spellcheck="false" required placeholder="XXXX-XXXX-…"></label><label class="reset-ack" id="recovery-add-label"><input id="recovery-add-passkey" type="checkbox" checked><span>Also create a passkey for this computer, so I do not need the recovery key next time. Lock the vault first if it is open.</span></label><div class="form-actions"><button id="recovery-submit" type="submit">Unlock with recovery key</button></div></form></details></section><footer>QVault · 0.49.0 · The passkey secret stays on this computer.</footer></main><script src="dist/unlock.js" type="module"></script></body></html>
