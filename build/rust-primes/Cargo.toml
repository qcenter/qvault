[package]
name = "qvault-rust-primes"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crypto-primes = "=0.7.2"
crypto-bigint = { version = "0.7", features = ["rand_core"] }
rand_chacha = "0.10"
rand_core = "0.10"
wasm-bindgen = "=0.2.117"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
